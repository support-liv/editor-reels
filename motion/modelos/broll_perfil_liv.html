<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>B-roll LIV (clean, só elementos do manual): seu perfil pode ser o caminho</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Tudo daqui sai do Manual de Identidade Visual da LIV:
         paleta (azul trust, laranja, marrom, bege, branco), Darker Grotesque,
         curva bege/azul com fio laranja (outdoor e posts), fio fino com arcos, seta dupla,
         arco duplo, estrela no círculo, losangos ♦♦, sublinhado laranja fino. Nada inventado. */
      @font-face { font-family: "Darker Grotesque"; src: url("fontes/DarkerGrotesque[wght].ttf") format("truetype"); font-weight: 300 900; }
      :root { --azul: #2c3642; --laranja: #ff6e1f; --marrom: #945943; --bege: #fff0e6; }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Darker Grotesque", sans-serif; }

      /* painel: tela cheia com a curva da marca no topo e na base; entra subindo e sai subindo */
      .painel { position: absolute; left: 0; top: -300px; width: 1080px; height: 2520px; transform: translateY(2520px); }
      .painel > svg.forma { position: absolute; inset: 0; width: 1080px; height: 2520px; }
      .conteudo { position: absolute; left: 0; top: 300px; width: 1080px; height: 1920px; }
      /* ZONA SEGURA 9:16 (padrão do time): x 60-1020, y 153-1510, sem o canto dos botões (x>835 e y>1205).
         Bloco principal 250-950; apoio 980-1170; faixa da legenda 1190-1390 livre; nada importante abaixo dela. */
      .rotulo { position: absolute; left: 96px; top: 250px; display: flex; align-items: center; gap: 18px;
                font-size: 40px; font-weight: 700; letter-spacing: 0.02em; }
      .losangos { width: 46px; height: 28px; }
      .linha { position: absolute; left: 96px; overflow: hidden; padding-bottom: 10px; }
      .linha span { display: block; font-size: 124px; font-weight: 800; line-height: 1.0; white-space: nowrap; letter-spacing: -0.01em; }
      .sub { position: absolute; left: 96px; height: 7px; background: var(--laranja); border-radius: 4px; transform-origin: left center; transform: scaleX(0); }
      .risco { position: absolute; height: 9px; background: var(--laranja); border-radius: 5px; transform-origin: left center; transform: scaleX(0); }
      .traco { fill: none; stroke-linecap: butt; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="19.13">
      <div id="tudo" class="clip" style="position:absolute;inset:0" data-start="0" data-duration="19.13">

        <!-- ===== PAINEL A (bege) — cena 1: formação acadêmica e experiência sólida ===== -->
        <div class="painel" id="pA">
          <svg class="forma" viewBox="0 0 1080 2520"><path d="M0 300 C 300 300, 760 210, 1080 0 L1080 2220 C 760 2430, 300 2520, 0 2520 Z" fill="#fff0e6"/>
            <path d="M0 300 C 300 300, 760 210, 1080 0" stroke="#ff6e1f" stroke-width="16" fill="none"/></svg>
          <div class="conteudo">
            <!-- fio fino com arcos (topo das páginas do manual) -->
            <svg style="position:absolute;left:0;top:20px;width:1080px;height:200px" viewBox="0 0 1080 200">
              <path class="traco" id="fioA" d="M0 170 H 1080" stroke="#945943" stroke-width="3"/>
              <path class="traco" id="arcoA" d="M620 170 C 700 150, 760 90, 780 0 C 800 90, 860 150, 940 170" stroke="#945943" stroke-width="3"/></svg>
            <div class="rotulo" style="color:#945943"><svg class="losangos" viewBox="0 0 46 28"><path d="M0 14 11 0 22 14 11 28zM24 14 35 0 46 14 35 28z" fill="#ff6e1f"/></svg><span id="rotA">o seu perfil</span></div>
            <div class="linha" style="top:370px"><span id="a1" style="color:#2c3642">Formação</span></div>
            <div class="linha" style="top:500px"><span id="a2" style="color:#2c3642">acadêmica</span></div>
            <div class="linha" style="top:670px"><span id="a3" style="color:#ff6e1f">e experiência</span></div>
            <div class="linha" style="top:800px"><span id="a4" style="color:#ff6e1f">sólida.</span></div>
            <div class="sub" id="subA" style="top:950px;width:340px"></div>
            <!-- seta dupla em contorno (posts do manual) -->
            <svg style="position:absolute;left:96px;top:1020px;width:220px;height:130px" viewBox="0 0 220 130">
              <path class="traco" id="setaA" d="M4 4 L64 65 L4 126 M64 4 L124 65 L64 126 M4 4 H64 M4 126 H64 M64 4 H124 M64 126 H124" stroke="#2c3642" stroke-width="3"/></svg>
          </div>
        </div>

        <!-- ===== PAINEL B (azul) — cenas 2 e 3: um caminho legítimo / sem empresa / sem milhões ===== -->
        <div class="painel" id="pB">
          <svg class="forma" viewBox="0 0 1080 2520"><path d="M0 300 C 300 300, 760 210, 1080 0 L1080 2220 C 760 2430, 300 2520, 0 2520 Z" fill="#2c3642"/>
            <path d="M0 300 C 300 300, 760 210, 1080 0" stroke="#ff6e1f" stroke-width="16" fill="none"/>
            <path d="M1080 2220 C 760 2430, 300 2520, 0 2520" stroke="#ff6e1f" stroke-width="16" fill="none"/></svg>
          <div class="conteudo">
            <div class="rotulo" style="color:#fff0e6"><svg class="losangos" viewBox="0 0 46 28"><path d="M0 14 11 0 22 14 11 28zM24 14 35 0 46 14 35 28z" fill="#ff6e1f"/></svg><span id="rotB">pode existir</span></div>
            <!-- cena 2 -->
            <div class="linha" style="top:400px"><span id="b1" style="color:#fff0e6">um caminho</span></div>
            <div class="linha" style="top:530px"><span id="b2" style="color:#ff6e1f">legítimo.</span></div>
            <!-- seta dupla sólida em laranja: o caminho -->
            <svg id="setaB" style="position:absolute;left:96px;top:760px;width:300px;height:170px" viewBox="0 0 300 170">
              <path d="M0 0 L85 85 L0 170 H70 L155 85 L70 0 Z M140 0 L225 85 L140 170 H210 L295 85 L210 0 Z" fill="#ff6e1f"/></svg>
            <!-- cena 3 -->
            <div class="linha" style="top:420px"><span id="b3" style="color:#fff0e6;font-size:112px">sem empresa</span></div>
            <div class="risco" id="r1" style="left:96px;top:490px;width:640px"></div>
            <div class="linha" style="top:620px"><span id="b4" style="color:#fff0e6;font-size:112px">sem investir</span></div>
            <div class="linha" style="top:740px"><span id="b5" style="color:#fff0e6;font-size:112px">milhões</span></div>
            <div class="risco" id="r2" style="left:96px;top:810px;width:430px"></div>
            <!-- estrela no círculo (canto, como no post do manual) -->
            <svg id="estrela" style="position:absolute;left:96px;top:990px;width:160px;height:160px" viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="100" fill="#ff6e1f"/><path d="M100 8C100 64 136 100 192 100 136 100 100 136 100 192 100 136 64 100 8 100 64 100 100 64 100 8z" fill="#2c3642"/></svg>
          </div>
        </div>

        <!-- ===== PAINEL C (bege) — cena 4: a LIV mostra se existe esse caminho para você ===== -->
        <div class="painel" id="pC">
          <svg class="forma" viewBox="0 0 1080 2520"><path d="M0 300 C 300 300, 760 210, 1080 0 L1080 2220 C 760 2430, 300 2520, 0 2520 Z" fill="#fff0e6"/>
            <path d="M0 300 C 300 300, 760 210, 1080 0" stroke="#ff6e1f" stroke-width="16" fill="none"/>
            <path d="M1080 2220 C 760 2430, 300 2520, 0 2520" stroke="#ff6e1f" stroke-width="16" fill="none"/></svg>
          <div class="conteudo">
            <!-- arco duplo sólido (iconografia) -->
            <svg id="arcoC" style="position:absolute;left:96px;top:980px;width:160px;height:160px" viewBox="0 0 200 200">
              <path d="M0 95V60h40a60 60 0 0 1 120 0h40v35h-40a60 60 0 0 0-120 0zM0 200v-35h40a60 60 0 0 1 120 0h40v35h-40a60 60 0 0 0-120 0z" fill="#ff6e1f"/></svg>
            <div class="rotulo" style="color:#945943"><svg class="losangos" viewBox="0 0 46 28"><path d="M0 14 11 0 22 14 11 28zM24 14 35 0 46 14 35 28z" fill="#ff6e1f"/></svg><span id="rotC">a LIV avalia e mostra</span></div>
            <div class="linha" style="top:420px"><span id="c1" style="color:#2c3642;font-size:112px">se existe</span></div>
            <div class="linha" style="top:540px"><span id="c2" style="color:#2c3642;font-size:112px">esse caminho</span></div>
            <div class="linha" style="top:660px"><span id="c3" style="color:#ff6e1f;font-size:112px">para você.</span></div>
            <div class="sub" id="subC" style="top:800px;width:450px"></div>
          </div>
        </div>

        <!-- ===== PAINEL D (laranja) — cena 5: análise do perfil sem custo ===== -->
        <div class="painel" id="pD">
          <svg class="forma" viewBox="0 0 1080 2520"><path d="M0 300 C 300 300, 760 210, 1080 0 L1080 2220 C 760 2430, 300 2520, 0 2520 Z" fill="#ff6e1f"/>
            <path d="M0 300 C 300 300, 760 210, 1080 0" stroke="#2c3642" stroke-width="16" fill="none"/></svg>
          <div class="conteudo">
            <svg id="arcoD" style="position:absolute;left:96px;top:230px;width:230px;height:150px" viewBox="0 0 230 150">
              <path d="M0 0h230v150h-45a70 70 0 0 0-140 0H0z" fill="#fff0e6"/></svg>
            <div class="linha" style="top:440px"><span id="d1" style="color:#ffffff">Análise do</span></div>
            <div class="linha" style="top:570px"><span id="d2" style="color:#ffffff">seu perfil</span></div>
            <div class="linha" style="top:720px"><span id="d3" style="color:#2c3642;font-size:96px">sem custo.</span></div>
            <div class="sub" id="subD" style="top:845px;width:380px;background:#2c3642"></div>
            <svg style="position:absolute;left:96px;top:1010px;width:70px;height:42px" viewBox="0 0 46 28" id="losD"><path d="M0 14 11 0 22 14 11 28zM24 14 35 0 46 14 35 28z" fill="#2c3642"/></svg>
          </div>
        </div>
      </div>

      <!-- sons discretos (LIV): passagens suaves, cliques leves, sino só na resolução -->
      <audio id="s01" src="sfx/whoosh.wav" data-start="4.33" data-duration="0.5" data-volume="0.4"></audio>
      <audio id="s02" src="sfx/tick.wav" data-start="4.84" data-duration="0.03" data-volume="0.28"></audio>
      <audio id="s03" src="sfx/tick.wav" data-start="6.10" data-duration="0.03" data-volume="0.28"></audio>
      <audio id="s04" src="sfx/whoosh_grave.wav" data-start="7.40" data-duration="0.8" data-volume="0.4"></audio>
      <audio id="s05" src="sfx/tick.wav" data-start="8.23" data-duration="0.03" data-volume="0.3"></audio>
      <audio id="s06" src="sfx/tick.wav" data-start="9.77" data-duration="0.03" data-volume="0.3"></audio>
      <audio id="s07" src="sfx/tick.wav" data-start="11.07" data-duration="0.03" data-volume="0.3"></audio>
      <audio id="s08" src="sfx/whoosh.wav" data-start="11.12" data-duration="0.5" data-volume="0.35"></audio>
      <audio id="s09" src="sfx/whoosh.wav" data-start="14.05" data-duration="0.5" data-volume="0.4"></audio>
      <audio id="s10" src="sfx/sino.wav" data-start="15.51" data-duration="1.2" data-volume="0.3"></audio>
      <audio id="s11" src="sfx/whoosh.wav" data-start="16.05" data-duration="0.5" data-volume="0.35"></audio>
      <audio id="s12" src="sfx/whoosh_grave.wav" data-start="17.35" data-duration="0.8" data-volume="0.4"></audio>
      <audio id="s13" src="sfx/sino.wav" data-start="18.82" data-duration="0.31" data-volume="0.3"></audio>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ENTRA = { duration: 0.55, ease: "power3.out" }, SAI = { duration: 0.5, ease: "power3.in" };
      const FORA_BAIXO = 2520, FORA_CIMA = -2520;

      // estado inicial: textos embaixo da máscara, traços por desenhar
      gsap.set(".linha span", { yPercent: 110 });
      document.querySelectorAll(".traco").forEach((p) => { const L = p.getTotalLength() + 2; gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); });
      gsap.set(["#setaB", "#estrela", "#arcoC", "#arcoD", "#losD"], { opacity: 0 });
      gsap.set([".rotulo"], { opacity: 0 });

      // revelação de linha (máscara), sempre igual: é a "entrada" da marca
      const revela = (sel, t) => tl.to(sel, { yPercent: 0, duration: 0.6, ease: "expo.out" }, t);
      const esconde = (sels, t) => tl.to(sels, { yPercent: -110, duration: 0.35, ease: "power2.in", stagger: 0.04 }, t);

      // ===== CENA 1 — painel bege sobe com a curva =====
      tl.fromTo("#pA", { y: FORA_BAIXO }, { y: 0, ...ENTRA }, 4.33)
        .set("#fioA", { opacity: 1 }, 4.55)
        .to("#fioA", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 4.55)
        .set("#arcoA", { opacity: 1 }, 4.7)
        .to("#arcoA", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 4.7)
        .to("#pA .rotulo", { opacity: 1, duration: 0.3 }, 4.6);
      revela("#a1", 4.80); revela("#a2", 4.92);
      revela("#a3", 6.06); revela("#a4", 6.18);
      tl.to("#subA", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 6.55)
        .set("#setaA", { opacity: 1 }, 6.3)
        .to("#setaA", { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 6.3);

      // ===== CENA 2 — painel azul sobe por cima do bege =====
      tl.fromTo("#pB", { y: FORA_BAIXO }, { y: 0, duration: 0.6, ease: "power3.inOut" }, 7.40)
        .set("#pA", { y: FORA_BAIXO }, 8.05)
        .to("#pB .rotulo", { opacity: 1, duration: 0.3 }, 7.75);
      revela("#b1", 7.85); revela("#b2", 8.18);
      tl.fromTo("#setaB", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 8.23);

      // ===== CENA 3 — mesmo painel: troca de frase =====
      esconde(["#b1", "#b2"], 8.95);
      tl.to("#setaB", { x: 160, opacity: 0, duration: 0.35, ease: "power2.in" }, 8.95)
        .to("#rotB", { opacity: 0, duration: 0.15 }, 8.95)
        .add(() => {}, 9.1);
      revela("#b3", 9.12);
      tl.to("#r1", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 9.74)
        .to("#b3", { opacity: 0.45, duration: 0.3 }, 9.9);
      revela("#b4", 10.26); revela("#b5", 10.38);
      tl.fromTo("#estrela", { opacity: 0, rotation: -30, x: 60 }, { opacity: 1, rotation: 0, x: 0, duration: 0.8, ease: "power3.out" }, 10.3)
        .to("#r2", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 11.02);
      // sai subindo (a curva de baixo passa pela tela) e revela a pessoa
      tl.to("#pB", { y: FORA_CIMA, duration: 0.55, ease: "power3.in" }, 11.1);

      // ===== CENA 4 — painel bege =====
      tl.fromTo("#pC", { y: FORA_BAIXO }, { y: 0, ...ENTRA }, 14.05)
        .to("#pC .rotulo", { opacity: 1, duration: 0.3 }, 14.35)
        .fromTo("#arcoC", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 14.4);
      revela("#c1", 14.45); revela("#c2", 14.8); revela("#c3", 15.4);
      tl.to("#subC", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 15.51)
        .to("#pC", { y: FORA_CIMA, duration: 0.5, ease: "power3.in" }, 16.05);

      // ===== CENA 5 — painel laranja (CTA) =====
      tl.fromTo("#pD", { y: FORA_BAIXO }, { y: 0, duration: 0.6, ease: "power3.out" }, 17.35)
        .fromTo("#arcoD", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 17.7);
      revela("#d1", 17.85); revela("#d2", 17.97); revela("#d3", 18.55);
      tl.to("#subD", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 18.8)
        .fromTo("#losD", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 18.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
