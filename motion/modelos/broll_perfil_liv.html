    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Darker Grotesque"; src: url("fontes/DarkerGrotesque[wght].ttf") format("truetype"); font-weight: 300 900; }
      :root { --azul: #2c3642; --azul-2: #36414e; --azul-3: #222a34; --laranja: #ff6e1f; --marrom: #945943; --bege: #fff0e6; }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent;
              font-family: "Darker Grotesque", sans-serif; color: var(--bege); }
      .abs { position: absolute; }

      /* ---------- palco comum: fundo com profundidade, entra e sai por faixa diagonal ---------- */
      #fundo { position: absolute; inset: 0; overflow: hidden;
               background: radial-gradient(120% 70% at 50% 38%, #3a4656 0%, var(--azul) 45%, var(--azul-3) 100%);
               clip-path: polygon(0% 0%, 0% 0%, -40% 100%, -40% 100%); }
      #grao { position: absolute; inset: -20px; opacity: 0.07; mix-blend-mode: overlay;
              background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
      .camada { position: absolute; inset: 0; }
      .geo { position: absolute; }
      #longe { filter: blur(8px); opacity: 0.06; }
      #meio  { filter: blur(3px); opacity: 0.05; }
      #perto { opacity: 0.045; }
      #faixa { position: absolute; top: -12%; left: -40%; width: 34%; height: 125%; background: var(--laranja); transform: skewX(-24deg);
               box-shadow: 0 0 80px rgba(255, 110, 31, 0.5); }
      #faixa2 { position: absolute; top: -12%; left: -40%; width: 12%; height: 125%; background: var(--bege); transform: skewX(-24deg); opacity: 0.9; }
      .brilho { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,110,31,0.55) 0%, rgba(255,110,31,0) 70%); opacity: 0; }

      /* zona de texto: 300-1090 px (a faixa da legenda, 1150-1330, e a interface do Reels ficam livres) */
      .cena { position: absolute; left: 0; right: 0; top: 0; height: 1920px; opacity: 0; }
      .kicker { position: absolute; left: 90px; top: 320px; font-size: 38px; font-weight: 700; letter-spacing: 0.3em; color: var(--laranja); }

      /* ---------- cena 1: cards 3D ---------- */
      #c1 { perspective: 1600px; }
      .card { position: absolute; left: 110px; width: 860px; height: 300px; border-radius: 34px; transform-style: preserve-3d;
              display: flex; align-items: center; gap: 40px; padding: 0 56px; box-sizing: border-box; }
      #cardA { top: 410px; background: var(--bege); color: var(--azul); box-shadow: 30px 40px 80px rgba(0,0,0,0.45); }
      #cardB { top: 760px; background: var(--azul-2); color: var(--bege); box-shadow: -30px 40px 80px rgba(0,0,0,0.45);
               border: 2px solid rgba(255,240,230,0.08); }
      .card .ico { width: 150px; height: 150px; flex: none; }
      .card .txt { display: flex; flex-direction: column; }
      .card .rot { font-size: 34px; font-weight: 700; letter-spacing: 0.22em; opacity: 0.7; }
      .card .tit { font-size: 92px; font-weight: 900; line-height: 0.95; white-space: nowrap; }
      #cardA .tit { color: var(--azul); } #cardB .tit { color: var(--laranja); }
      .barra { position: absolute; bottom: 0; width: 34px; border-radius: 8px 8px 0 0; background: var(--laranja); transform-origin: bottom; }

      /* ---------- cena 2: caminho ---------- */
      .profundo { position: absolute; left: 90px; top: 380px; }
      .profundo .camada-txt { position: absolute; left: 0; top: 0; font-size: 150px; font-weight: 900; line-height: 0.9; white-space: nowrap; }
      .profundo .frente { position: relative; color: var(--bege); }
      #rota { position: absolute; left: 0; top: 640px; width: 1080px; height: 460px; overflow: visible; }
      .pino { position: absolute; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center;
              font-size: 46px; font-weight: 900; letter-spacing: 0.04em; }
      #pinoBR { left: 110px; top: 930px; background: var(--azul-2); color: var(--bege); border: 4px solid rgba(255,240,230,0.25); }
      #pinoUS { left: 820px; top: 660px; background: var(--laranja); color: #fff; box-shadow: 0 0 60px rgba(255,110,31,0.6); }
      #viajante { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff;
                  box-shadow: 0 0 30px 8px rgba(255,240,230,0.7); left: 0; top: 0; }
      .particula { position: absolute; width: 14px; height: 14px; border-radius: 50%; left: 0; top: 0; opacity: 0; }

      /* ---------- cena 3: negações ---------- */

      #semEmpresa { position: absolute; left: 340px; top: 430px; font-size: 104px; font-weight: 900; line-height: 0.95; white-space: nowrap; }

      #milhoes { position: absolute; left: 90px; top: 780px; }
      #milhoes .camada-txt { position: absolute; left: 0; top: 0; font-size: 170px; font-weight: 900; line-height: 1; white-space: nowrap;
                             font-variant-numeric: tabular-nums; }
      #milhoes .frente { position: relative; color: var(--bege); }
      #riscoM { position: absolute; left: 70px; top: 870px; height: 22px; width: 940px; background: var(--laranja); border-radius: 11px;
                transform-origin: left center; transform: scaleX(0) rotate(-4deg); box-shadow: 0 0 30px rgba(255,110,31,0.7); }

      /* ---------- cena 4: análise ---------- */
      #painel { position: absolute; left: 90px; top: 360px; width: 900px; height: 720px; border-radius: 40px; background: var(--bege);
                color: var(--azul); box-shadow: 0 50px 120px rgba(0,0,0,0.5); overflow: hidden; }

      #painel .titulo { position: absolute; left: 60px; top: 104px; font-size: 84px; font-weight: 900; line-height: 0.95; white-space: nowrap; }
      #anel { position: absolute; right: 60px; top: 60px; width: 190px; height: 190px; }
      #pct { position: absolute; right: 60px; top: 60px; width: 190px; height: 190px; display: grid; place-items: center;
             font-size: 58px; font-weight: 900; color: var(--azul); }
      .item { position: absolute; left: 60px; height: 104px; width: 780px; border-radius: 26px; background: #fff;
              display: flex; align-items: center; gap: 28px; padding: 0 30px; box-sizing: border-box; font-size: 56px; font-weight: 800;
              box-shadow: 0 10px 30px rgba(44,54,66,0.10); }
      .item .ok { width: 60px; height: 60px; border-radius: 50%; background: var(--azul-2); display: grid; place-items: center; flex: none; }
      .item .ok svg { width: 34px; height: 34px; }
      #it1 { top: 320px; } #it2 { top: 450px; } #it3 { top: 580px; }

      /* ---------- cena 5: CTA ---------- */
      #ctaTopo { position: absolute; left: 90px; top: 360px; font-size: 40px; font-weight: 700; letter-spacing: 0.3em; color: var(--laranja); }

              color: var(--laranja); display: grid; place-items: center; font-size: 96px; font-weight: 900; letter-spacing: 0.04em;
              transform: rotate(-9deg); background: rgba(255,110,31,0.08); }

    <script>
      // ----- utilidades (determinísticas) -----
      const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const $ = (s) => document.querySelector(s);

      // formas geométricas da LIV em 3 camadas de profundidade (posições fixas, paralaxe no timeline)
      const FORMAS = [
        '<path d="M0 200V110a100 100 0 0 1 200 0v90h-40v-90a60 60 0 0 0-120 0v90z" fill="#fff0e6"/>',
        '<circle cx="100" cy="100" r="96" fill="none" stroke="#fff0e6" stroke-width="6"/><path d="M100 4C100 60 140 100 196 100 140 100 100 140 100 196 100 140 60 100 4 100 60 100 100 60 100 4z" fill="#fff0e6"/>',
        '<path d="M0 200h60v-50h50v-50h50V50h40v150z" fill="#fff0e6"/>',
        '<path d="M20 100 60 20 100 100 60 180zM100 100 140 20 180 100 140 180z" fill="#fff0e6"/>',
      ];
      [["#longe", 3, 760], ["#meio", 3, 460], ["#perto", 3, 280]].forEach(([sel, n, tam], L) => {
        let html = "";
        for (let i = 0; i < n; i++) {
          const x = Math.round(prand(i * 7 + L * 31) * 1080 - tam / 3), y = Math.round(prand(i * 13 + L * 17) * 1920 - tam / 3);
          html += `<svg class="geo" data-i="${i}" viewBox="0 0 200 200" style="left:${x}px;top:${y}px;width:${tam}px;height:${tam}px">${FORMAS[(i + L) % 4]}</svg>`;
        }
        $(sel).innerHTML = html;
      });

      // texto com volume: camadas empilhadas (extrusão 3D) montadas uma vez
      function profundo(el) {
        const linhas = el.dataset.texto.split("|").join("<br/>");
        let html = "";
        for (let i = 5; i >= 1; i--)
          html += `<div class="camada-txt tras" data-i="${i}" style="color:${i % 2 ? "#ff6e1f" : "#945943"};opacity:${0.18 + 0.1 * (5 - i)}">${linhas}</div>`;
        html += `<div class="camada-txt frente">${linhas}</div>`;
        el.innerHTML = html;
      }
      document.querySelectorAll(".fit-grupo").forEach(profundo);

      // partículas (posições calculadas por fórmula a partir do tempo: seek-safe)
      function particulas(sel, n, cor) {
        let html = "";
        for (let i = 0; i < n; i++) html += `<div class="particula" style="background:${i % 3 ? cor : "#fff0e6"}"></div>`;
        $(sel).innerHTML = html;
        return [...$(sel).children];
      }
      const P2 = particulas("#part2", 26, "#ff6e1f"), P3 = particulas("#part3", 30, "#ff6e1f"), P5 = particulas("#part5", 26, "#ff6e1f");
      function explodir(tl, lista, t0, ox, oy, forca, dur = 1.0) {
        const d = { T: 0 };
        tl.fromTo(d, { T: 0 }, { T: 1, duration: dur, ease: "none", immediateRender: false, onUpdate: () => {
          lista.forEach((p, i) => {
            const ang = prand(i + 3) * Math.PI * 2, v = forca * (0.45 + prand(i + 9)), s = d.T * dur;
            const x = ox + Math.cos(ang) * v * s, y = oy + Math.sin(ang) * v * s + 900 * s * s;
            p.style.transform = `translate(${x}px, ${y}px) scale(${1.4 - d.T})`;
            p.style.opacity = d.T > 0 && d.T < 1 ? String(1 - d.T) : "0";
          });
        } }, t0);
      }

      document.fonts.ready.then(() => {
        // ajusta o texto à largura (nada corta na lateral): mede uma vez, na montagem
        document.querySelectorAll(".fit, .fit-grupo").forEach((el) => {
          const max = Number(el.dataset.max);
          const alvos = el.classList.contains("fit-grupo") ? [...el.querySelectorAll(".camada-txt")] : [el];
          let tam = parseFloat(getComputedStyle(alvos[alvos.length - 1]).fontSize);
          const medir = () => (el.classList.contains("fit-grupo") ? alvos[alvos.length - 1].scrollWidth : el.scrollWidth);
          while (medir() > max && tam > 30) { tam -= 2; alvos.forEach((a) => (a.style.fontSize = tam + "px")); }
        });
        // posição do ponto que viaja na rota (pré-calculada)
        const rota = $("#rotaP"), L = rota.getTotalLength();
        const PONTOS = Array.from({ length: 61 }, (_, i) => rota.getPointAtLength((L * i) / 60));

        const tl = gsap.timeline({ paused: true });
        gsap.set("#faixa", { xPercent: -300 }); gsap.set("#faixa2", { xPercent: -900 });   // fora da tela até a 1ª entrada

        // ----- transições de marca: faixa laranja + faixa bege atravessando -----
        function entra(t) {
          tl.fromTo("#faixa", { xPercent: -300 }, { xPercent: 620, duration: 0.6, ease: "power3.inOut", immediateRender: false }, t)
            .fromTo("#faixa2", { xPercent: -900 }, { xPercent: 1500, duration: 0.65, ease: "power3.inOut", immediateRender: false }, t + 0.04)
