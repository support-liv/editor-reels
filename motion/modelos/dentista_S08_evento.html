        // títulos de uma mesma comparação (colunas, cartões) no mesmo tamanho: o menor que coube

        document.querySelectorAll(".fit[data-grupo]").forEach((el) => { (grupos[el.dataset.grupo] = grupos[el.dataset.grupo] || []).push(el); });
        Object.values(grupos).forEach((els) => {
          const menor = Math.min(...els.map((el) => parseFloat(el.style.fontSize)));
          els.forEach((el) => { el.style.fontSize = menor + "px"; });
        });
        // sublinhado da largura exata do título (colunas com "sub_titulo"), medido depois do ajuste de tamanho
        document.querySelectorAll("[data-larg]").forEach((b) => {
          const alvo = document.getElementById(b.dataset.larg); if (alvo) b.style.width = alvo.offsetWidth + "px";
        });
        // colunas: o fio fica no meio do vão real entre as duas colunas (mesma margem dos dois lados),
        // medido pelo fim do conteúdo da esquerda, não pelo meio da tela
        document.querySelectorAll("[data-colunas]").forEach((box) => {
          const id = box.dataset.colunas, x0 = Number(box.dataset.x0), x1 = Number(box.dataset.x1);
          const esq = document.getElementById(id + "c0"), dir = document.getElementById(id + "c1"), fio = document.getElementById(id + "f");
          if (!esq || !dir || !fio) return;
          const largura = (col) => {
            let m = 0;
            col.querySelectorAll("div, span").forEach((n) => {
              if (getComputedStyle(n).position === "absolute" || n.id.endsWith("s0") || n.id.endsWith("s1")) return;
              const r = n.getBoundingClientRect(), c = col.getBoundingClientRect();
              if (n.children.length === 0 || n.classList.contains("fit")) m = Math.max(m, r.right - c.left);
            });
            return m;
          };
          const we = largura(esq), wd = largura(dir);
          const vao = Math.min(64, Math.max(28, (x1 - x0 - we - wd - 4) / 2));
          const xf = x0 + we + vao;
          fio.style.left = xf + "px";
          dir.style.left = (xf + 4 + vao) + "px"; dir.style.width = (x1 - xf - 4 - vao) + "px";
          esq.style.width = we + "px";
        });
        // componente centralizado: mede a união do conteúdo visível (texto pelas letras, traços do SVG) e desloca a
        // caixa inteira pra que o meio do conteúdo fique no meio da tela (colunas, checklist, etapas, barra)
        const raiz = document.getElementById("root").getBoundingClientRect(), esc = raiz.width / 1080;
        document.querySelectorAll("[data-cx]").forEach((box) => {
          let l = 1e9, r = -1e9;
          box.querySelectorAll("*").forEach((n) => {
            if (n.children.length) return;
            let rc;
            if (n instanceof SVGElement) rc = n.getBoundingClientRect();
            else { const rg = document.createRange(); rg.selectNodeContents(n); rc = rg.getBoundingClientRect(); }
            if (rc.width < 1) return;
            l = Math.min(l, rc.left); r = Math.max(r, rc.right);
          });
          if (r < l) return;
          const desl = (raiz.left + raiz.width / 2 - (l + r) / 2) / esc;
          box.style.left = (parseFloat(box.style.left || 0) + desl) + "px";
        });
        // sublinhado e risco do tamanho exato do texto (linha inteira ou uma palavra), alinhado à esquerda ou
        // centralizado: posição somada pela cadeia de offsetParent até o pai do traço (sem transform no meio)
        const posEm = (el, ref) => {
          let x = 0, y = 0, n = el;
          while (n && n !== ref) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
          return { x, y };
        };
        document.querySelectorAll(".barra[data-alvo]").forEach((b) => {
          const alvo = document.getElementById(b.dataset.alvo); if (!alvo) return;
          const p = posEm(alvo, b.offsetParent), h = alvo.offsetHeight;
          if (b.dataset.sob) {                          // logo abaixo da linha de base, do tamanho do texto
            b.style.left = p.x + "px"; b.style.width = alvo.offsetWidth + "px";
            b.style.top = (p.y + h * 0.96 + 4) + "px"; return;
          }
          b.style.left = (p.x - 12) + "px"; b.style.width = (alvo.offsetWidth + 24) + "px";
          if (b.dataset.meio) b.style.top = (p.y + h * 0.55 - b.offsetHeight / 2) + "px";   // risco no meio da altura das letras
