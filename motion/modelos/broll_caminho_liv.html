<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>B-roll: formação + experiência = caminho (LIV)</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Darker Grotesque";
        src: url("fontes/DarkerGrotesque[wght].ttf") format("truetype");
        font-weight: 300 900;
      }
      :root {
        --azul: #2c3642; --azul-2: #37424f; --laranja: #ff6e1f; --marrom: #945943; --bege: #fff0e6;
      }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent;
              font-family: "Darker Grotesque", sans-serif; color: var(--bege); }
      .cena { position: absolute; inset: 0; }
      /* fundo: azul da marca, entra/sai por uma faixa diagonal (o traço do V do logo) */
      #fundo { position: absolute; inset: 0; background: var(--azul);
               clip-path: polygon(0% 0%, 0% 0%, -40% 100%, -40% 100%); }
      #faixa { position: absolute; top: -10%; left: -30%; width: 34%; height: 120%; background: var(--laranja);
               transform: skewX(-24deg); }
      /* iconografia geométrica da LIV, bem sutil, em paralaxe */
      .geo { position: absolute; opacity: 0.10; }
      #geo-arco { width: 900px; top: -220px; right: -330px; }
      #geo-estrela { width: 520px; bottom: 120px; left: -160px; }
      /* palco: tudo que é texto fica entre 330 e 1090 px (a faixa da legenda, ~1150-1330, fica livre) */
      .palco { position: absolute; left: 90px; right: 90px; top: 330px; height: 760px; }
      .kicker { font-size: 40px; font-weight: 700; letter-spacing: 0.32em; color: var(--laranja); }
      .linha { overflow: hidden; line-height: 0.9; padding-bottom: 12px; }
      .grande { display: block; font-size: 168px; font-weight: 900; letter-spacing: -0.01em; }
      .medio { display: block; font-size: 64px; font-weight: 600; color: var(--bege); opacity: 0.85; }
      .mais { position: absolute; left: 0; top: 330px; width: 110px; height: 110px; }
      .mais i { position: absolute; background: var(--laranja); border-radius: 10px; }
      .mais i:nth-child(1) { left: 0; top: 43px; width: 110px; height: 24px; }
      .mais i:nth-child(2) { left: 43px; top: 0; width: 24px; height: 110px; }
      #a1-form { position: absolute; top: 90px; left: 0; }
      #a1-exp { position: absolute; top: 470px; left: 0; }
      #a1-sub { position: absolute; top: 690px; left: 0; }
      /* ato 2 */
      #a2-tit { position: absolute; top: 60px; left: 0; }
      #a2-tit .grande { font-size: 132px; }
      #traco { position: absolute; top: 380px; left: 0; width: 900px; height: 30px; }
      .item { position: absolute; left: 0; display: flex; align-items: center; gap: 30px;
              font-size: 86px; font-weight: 800; }
      .item .x { width: 76px; height: 76px; border-radius: 18px; background: var(--azul-2);
                 display: grid; place-items: center; flex: none; }
      .item .x svg { width: 38px; height: 38px; }
      .risco { position: absolute; left: -12px; top: 50%; height: 12px; width: calc(100% + 24px);
               background: var(--laranja); border-radius: 6px; transform-origin: left center; transform: scaleX(0); }
      #it-empresa { top: 450px; }
      #it-milhoes { top: 610px; }
      #contador { position: relative; font-variant-numeric: tabular-nums; color: var(--bege); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6.96">
      <div id="cena" class="cena clip" data-start="0" data-duration="6.96">
        <div id="fundo">
          <svg id="geo-arco" class="geo" viewBox="0 0 200 200"><path d="M0 200V110a100 100 0 0 1 200 0v90h-40v-90a60 60 0 0 0-120 0v90z" fill="#fff0e6"/></svg>
          <svg id="geo-estrela" class="geo" viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="none" stroke="#fff0e6" stroke-width="4"/><path d="M100 2C100 60 140 100 198 100 140 100 100 140 100 198 100 140 60 100 2 100 60 100 100 60 100 2z" fill="#fff0e6"/></svg>

          <!-- ATO 1: formação + experiência -->
          <div class="palco" id="ato1">
            <div class="kicker" id="a1-kicker">O SEU PERFIL</div>
            <div class="linha" id="a1-form"><span class="grande" id="w-form">FORMAÇÃO</span></div>
            <div class="mais" id="mais"><i></i><i></i></div>
            <div class="linha" id="a1-exp"><span class="grande" id="w-exp">EXPERIÊNCIA</span></div>
            <div class="linha" id="a1-sub"><span class="medio" id="w-sub">sólida, na sua área</span></div>
          </div>

          <!-- ATO 2: caminho legítimo, sem empresa, sem milhões -->
          <div class="palco" id="ato2">
            <div class="kicker" id="a2-kicker">PODE EXISTIR</div>
            <div class="linha" id="a2-tit"><span class="grande" id="w-cam">UM CAMINHO<br />LEGÍTIMO</span></div>
            <svg id="traco" viewBox="0 0 900 30"><path id="traco-p" d="M4 15 H896" stroke="#ff6e1f" stroke-width="10" stroke-linecap="round" fill="none"/></svg>
            <div class="item" id="it-empresa"><span class="x"><svg viewBox="0 0 40 40"><path d="M8 8L32 32M32 8L8 32" stroke="#ff6e1f" stroke-width="7" stroke-linecap="round"/></svg></span><span style="position:relative">SEM EMPRESA<b class="risco" id="r1"></b></span></div>
            <div class="item" id="it-milhoes"><span class="x"><svg viewBox="0 0 40 40"><path d="M8 8L32 32M32 8L8 32" stroke="#ff6e1f" stroke-width="7" stroke-linecap="round"/></svg></span><span style="position:relative">SEM <span id="contador">US$ 0</span><b class="risco" id="r2"></b></span></div>
          </div>
        </div>
        <div id="faixa"></div>
      </div>

      <!-- efeitos sonoros: cada um no quadro da animação -->
      <audio id="s-entra" src="sfx/whoosh.wav" data-start="0" data-duration="0.5" data-volume="0.8"></audio>
      <audio id="s-form" src="sfx/pop.wav" data-start="0.41" data-duration="0.09" data-volume="0.7"></audio>
      <audio id="s-mais" src="sfx/tick.wav" data-start="1.28" data-duration="0.03" data-volume="0.8"></audio>
      <audio id="s-exp" src="sfx/pop.wav" data-start="1.67" data-duration="0.09" data-volume="0.7"></audio>
      <audio id="s-virada" src="sfx/whoosh_grave.wav" data-start="2.98" data-duration="0.8" data-volume="0.8"></audio>
      <audio id="s-cam" src="sfx/impacto.wav" data-start="3.80" data-duration="0.9" data-volume="0.7"></audio>
      <audio id="s-emp" src="sfx/pop.wav" data-start="4.68" data-duration="0.09" data-volume="0.6"></audio>
      <audio id="s-r1" src="sfx/riscar.wav" data-start="5.05" data-duration="0.22" data-volume="0.8"></audio>
      <audio id="s-t1" src="sfx/tick.wav" data-start="5.90" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-t2" src="sfx/tick.wav" data-start="6.00" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-t3" src="sfx/tick.wav" data-start="6.10" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-t4" src="sfx/tick.wav" data-start="6.20" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-t5" src="sfx/tick.wav" data-start="6.30" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-t6" src="sfx/tick.wav" data-start="6.40" data-duration="0.03" data-volume="0.45"></audio>
      <audio id="s-r2" src="sfx/riscar.wav" data-start="6.58" data-duration="0.22" data-volume="0.9"></audio>
      <audio id="s-imp" src="sfx/impacto.wav" data-start="6.62" data-duration="0.34" data-volume="0.55"></audio>
      <audio id="s-sai" src="sfx/whoosh.wav" data-start="6.62" data-duration="0.34" data-volume="0.6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const A2 = 3.11; // começo do ato 2 (a frase "pode existir um caminho...")

      // estado inicial
      gsap.set(["#w-form", "#w-exp", "#w-sub", "#w-cam"], { yPercent: 110 });
      gsap.set("#ato2", { autoAlpha: 0 });
      gsap.set("#mais", { scale: 0, rotation: -90 });
      gsap.set(["#it-empresa", "#it-milhoes"], { x: -80, autoAlpha: 0 });
      gsap.set("#traco-p", { strokeDasharray: 900, strokeDashoffset: 900 });
      gsap.set(["#a1-kicker", "#a2-kicker"], { autoAlpha: 0, x: -30 });

      // ENTRADA: a faixa laranja atravessa a tela e o azul abre atrás dela
      tl.fromTo("#faixa", { xPercent: 0 }, { xPercent: 620, duration: 0.55, ease: "power3.inOut" }, 0)
        .to("#fundo", { clipPath: "polygon(0% 0%, 140% 0%, 100% 100%, -40% 100%)", duration: 0.5, ease: "power3.inOut" }, 0.03)
        // paralaxe lenta dos ícones e um push de câmera no palco (vida sem distrair)
        .fromTo("#geo-arco", { rotation: -8, y: -40 }, { rotation: 6, y: 40, duration: 6.96, ease: "none" }, 0)
        .fromTo("#geo-estrela", { rotation: 0, scale: 0.95 }, { rotation: 45, scale: 1.05, duration: 6.96, ease: "none" }, 0)
        .fromTo("#ato1", { scale: 1 }, { scale: 1.035, duration: 2.9, ease: "none", transformOrigin: "30% 40%" }, 0.2)

      // ATO 1
        .to("#a1-kicker", { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.22)
        .to("#w-form", { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.38)
        .to("#mais", { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, 1.22)
        .to("#w-exp", { yPercent: 0, duration: 0.5, ease: "expo.out" }, 1.64)
        .to("#w-sub", { yPercent: 0, duration: 0.45, ease: "power3.out" }, 2.06)
        .to("#w-exp", { color: "#ff6e1f", duration: 0.25, ease: "power1.out" }, 2.06)

      // VIRADA: o ato 1 sobe e sai, a faixa varre de volta, o ato 2 entra
        .to("#ato1", { yPercent: -18, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 2.95)
        .fromTo("#faixa", { xPercent: 620 }, { xPercent: -220, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 2.98)
        .set("#ato2", { autoAlpha: 1 }, A2 + 0.1)

      // ATO 2
        .to("#a2-kicker", { autoAlpha: 1, x: 0, duration: 0.3, ease: "power3.out" }, A2 + 0.12)
        .to("#w-cam", { yPercent: 0, duration: 0.45, ease: "expo.out" }, A2 + 0.62)
        .fromTo("#a2-tit", { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" }, A2 + 0.62)
        .to("#traco-p", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, A2 + 0.8)
        .to("#it-empresa", { x: 0, autoAlpha: 1, duration: 0.4, ease: "expo.out" }, A2 + 1.52)
        .to("#r1", { scaleX: 1, duration: 0.25, ease: "power2.in" }, A2 + 1.94)
        .to("#it-empresa", { autoAlpha: 0.55, duration: 0.3 }, A2 + 2.2)
        .to("#it-milhoes", { x: 0, autoAlpha: 1, duration: 0.4, ease: "expo.out" }, A2 + 2.62);

      // contador: sobe até US$ 1.000.000 com os ticks, e é riscado no "milhões"
      const n = { v: 0 };
      tl.to(n, { v: 1000000, duration: 0.7, ease: "power2.in",
                 onUpdate: () => { document.getElementById("contador").textContent = "US$ " + Math.round(n.v).toLocaleString("pt-BR"); } }, A2 + 2.72)
        .to("#r2", { scaleX: 1, duration: 0.18, ease: "power3.in" }, A2 + 3.47)
        .fromTo("#it-milhoes", { x: 0 }, { x: 14, duration: 0.05, repeat: 3, yoyo: true, ease: "none" }, A2 + 3.52)
        .to("#contador", { color: "#ff6e1f", duration: 0.1 }, A2 + 3.5)

      // SAÍDA: a faixa atravessa de novo e o azul fecha, revelando a pessoa
        .fromTo("#faixa", { xPercent: -220 }, { xPercent: 620, duration: 0.34, ease: "power3.in", immediateRender: false }, 6.62)
        .to("#fundo", { clipPath: "polygon(140% 0%, 140% 0%, 100% 100%, 100% 100%)", duration: 0.3, ease: "power3.in" }, 6.66);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
